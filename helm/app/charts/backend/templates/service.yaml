apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend.fullname" . }}-service
  labels:
{{ include "backend.labels" . | indent 4 }}
spec:
  {{- with .Values.service }}
  type: {{ .type }}
  {{- with .port }}
  ports:
    - port: {{ .port }}
      targetPort: {{ .targetPort }}
  {{- end }}
  {{- end }}
  selector:
{{- include "backend.selectorLabels" . | nindent 4 }}